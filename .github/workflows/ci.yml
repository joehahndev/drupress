name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  drupal:
    uses: joehahndev/drupal-module-ci/.github/workflows/drupal.yml@v1
    with:
      install-map: |
        modules/drupress:web/modules/custom/drupress
        themes/drupress_admin:web/themes/custom/drupress_admin
      phpstan-level: '6'
      # Drupress requires Drupal 11.1+; see the info.yml files.
      drupal-versions: '["^11.4"]'
