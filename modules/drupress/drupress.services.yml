services:
  _defaults:
    autowire: true

  drupress.mapping:
    class: Drupal\drupress\DrupressMapping

  Drupal\drupress\DrupressMapping: '@drupress.mapping'

  drupress.structure_installer:
    class: Drupal\drupress\DrupressStructureInstaller

  Drupal\drupress\DrupressStructureInstaller: '@drupress.structure_installer'

  drupress.config_subscriber:
    class: Drupal\drupress\EventSubscriber\ConfigSubscriber
    arguments:
      - '@plugin.manager.menu.link'
      - '@cache_tags.invalidator'
    tags:
      - { name: event_subscriber }
