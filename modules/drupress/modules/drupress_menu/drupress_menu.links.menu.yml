# Dynamic links: targets depend on the drupress.settings mapping and on which
# modules/views exist. Generated by the deriver so they stay correct when the
# mapping changes.
drupress_menu.dynamic:
  menu_name: drupress-admin
  deriver: Drupal\drupress_menu\Plugin\Derivative\DrupressMenuLinks
