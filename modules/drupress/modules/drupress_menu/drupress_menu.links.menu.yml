# Static links: fixed Drupal routes that always exist.
# WP order: Dashboard(0) Posts(5) Media(10) Pages(15) Comments(20)
#           Appearance(25) Plugins(30) Users(35) Tools(40) Settings(45).

drupress_menu.appearance:
  title: 'Appearance'
  description: 'Themes'
  menu_name: drupress-admin
  route_name: system.themes_page
  weight: 25
  options:
    icon:
      pack_id: drupress
      icon_id: appearance

drupress_menu.appearance.themes:
  title: 'Themes'
  menu_name: drupress-admin
  parent: drupress_menu.appearance
  route_name: system.themes_page
  weight: 0

drupress_menu.plugins:
  title: 'Plugins'
  description: 'Modules ("plugins" in WordPress terms)'
  menu_name: drupress-admin
  route_name: system.modules_list
  weight: 30
  options:
    icon:
      pack_id: drupress
      icon_id: plugins

drupress_menu.plugins.installed:
  title: 'Installed Plugins'
  menu_name: drupress-admin
  parent: drupress_menu.plugins
  route_name: system.modules_list
  weight: 0

drupress_menu.users:
  title: 'Users'
  menu_name: drupress-admin
  route_name: entity.user.collection
  weight: 35
  options:
    icon:
      pack_id: drupress
      icon_id: users

drupress_menu.users.all:
  title: 'All Users'
  menu_name: drupress-admin
  parent: drupress_menu.users
  route_name: entity.user.collection
  weight: 0

drupress_menu.users.add:
  title: 'Add New User'
  menu_name: drupress-admin
