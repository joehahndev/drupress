  menu_name: drupress-admin
  route_name: system.admin_reports
  weight: 40
  options:
    icon:
      pack_id: drupress
      icon_id: tools

drupress_menu.settings:
  title: 'Settings'
  menu_name: drupress-admin
  route_name: system.admin_config
  weight: 45
  options:
    icon:
      pack_id: drupress
      icon_id: settings

drupress_menu.settings.general:
  title: 'General'
  menu_name: drupress-admin
  parent: drupress_menu.settings
  route_name: system.site_information_settings
