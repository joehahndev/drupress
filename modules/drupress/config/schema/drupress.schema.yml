drupress.settings:
  type: config_object
  label: 'Drupress settings'
  mapping:
    post_node_type:
      type: string
      label: 'Node type used as WordPress "Posts"'
    page_node_type:
      type: string
      label: 'Node type used as WordPress "Pages"'
    category_vocabulary:
      type: string
      label: 'Taxonomy vocabulary used as WordPress "Categories"'
    tag_vocabulary:
      type: string
      label: 'Taxonomy vocabulary used as WordPress "Tags"'
    featured_image_field:
      type: string
      label: 'Field on the post node type used as the WordPress "Featured image"'
    login_redirect_dashboard:
      type: boolean
      label: 'Redirect users to the Drupress dashboard after login'
