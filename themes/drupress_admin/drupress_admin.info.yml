name: 'Drupress Admin'
type: theme
description: 'WordPress-look administration theme. Part of the Drupress suite.'
package: Drupress
core_version_requirement: ^11.1
base theme: claro

libraries:
  - drupress_admin/tokens
  - drupress_admin/list-tables
  - drupress_admin/media

libraries-extend:
  navigation/internal.navigation:
    - drupress_admin/navigation
